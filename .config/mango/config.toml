# Converted from config.conf
# NOTE: in TOML a table runs until the next header, so all plain options,
# [env] and [var] come before any [bind.*] / [[rule.*]] tables.

[global]
# Execs first time
exec_once = ["~/.config/mango/autostart.sh", "mangobar"]

# Reload automatically when this file (or sourced files) changes
auto_reload_config = 1

animations = 1
gap_inner_horizontal = 12
gap_inner_vertical = 12
gap_outer_horizontal = 12
gap_outer_vertical = 12
border_px = 3
no_border_when_single = 0
global_color = 0x8409CEAA
focus_color = 0xF7501AEE

# Mouse and trackpad settings
trackpad_natural_scrolling = 1
trackpad_disable_while_typing = 1
trackpad_click_method = 2
mouse_natural_scrolling = 1
mouse_accel_profile = 1
mouse_accel_speed = -0.6

# General options
cursor_theme = "Summoner"
cursor_size = 32
trackpad_accel_profile = 0
scratchpad_cross_monitor = 1
cursor_hide_timeout = 10
drag_tile_to_tile = 1 # automatically retile tile
drag_corner = 4       # resize floating windows from the nearest corner
repeat_delay = 180
repeat_rate = 50
enable_hotarea = 0

# Language rules
xkb_rules_layout = "us,latam,de"
# xkb_rules_variant = "altgr-intl"
# xkb_rules_options = "lv3:ralt_switch"

# Effect
blur = 0
blur_layer = 1
blur_optimized = 1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 1
layer_shadows = 1
shadow_only_floating = 1
shadows_size = 12
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color = 0x000000ff

# Animation Configuration
layer_animations = 1
animation_type_open = "zoom"
animation_type_close = "slide"
layer_animation_type_open = "slide"
layer_animation_type_close = "slide"
animation_fade_in = 1
animation_fade_out = 1
tag_animation_direction = 1
zoom_initial_ratio = 0.3
zoom_end_ratio = 0.7
fade_in_begin_opacity = 0.6
fade_out_begin_opacity = 0.8
animation_duration_move = 500
animation_duration_open = 400
animation_duration_tag = 350
animation_duration_close = 800
animation_curve_open = [0.46, 1.0, 0.29, 1.1]
animation_curve_move = [0.46, 1.0, 0.29, 1]
animation_curve_tag = [0.46, 1.0, 0.29, 1]
animation_curve_close = [0.08, 0.92, 0, 1]

# Scroller Layout Setting
scroller_structs = 20
scroller_default_proportion = 0.8
scroller_focus_center = 0
scroller_prefer_center = 1
edge_scroller_pointer_focus = 1
scroller_default_proportion_single = 1.0
scroller_proportion_preset = [0.5, 0.8, 1.0]

# Tile Layout Settings
center_master_overspread = 1
center_when_single_stack = 1

# Env stuff
[env]
"BROWSER" = "zen-browser"
"GTK_THEME" = "Sweet:dark"
"HOME" = "/home/neto"
"XCURSOR_THEME" = "Summoner"
"XCURSOR_SIZE" = "32"

# ---------------------------------------------------------------------------
# Default key mode bindings
# ---------------------------------------------------------------------------
[bind.default]
"SUPER+Return" = "spawn,ghostty"
"SUPER+q" = "killclient"
"SUPER+SHIFT+r" = "spawn,wofi -show run"
"SUPER+m" = "spawn,wofi"
"SUPER+v" = "spawn,clipboard"
"SUPER+SHIFT+v" = "spawn,clipse -clear"

"SUPER+1" = "comboview,1"
"SUPER+2" = "comboview,2"
"SUPER+3" = "comboview,3"
"SUPER+4" = "comboview,4"
"SUPER+5" = "comboview,5"
"SUPER+6" = "comboview,6"
"SUPER+7" = "comboview,7"
"SUPER+8" = "comboview,8"
"SUPER+9" = "comboview,9"

# put a window in scratchpad link
"SUPER+SHIFT+c" = "minimized"
# Go through all the bookmarks
"SUPER+c" = "toggle_scratchpad"
# move out a window from scratchpad link
# you can also do togglefloating move out
# "SUPER+SHIFT+I" = "restore_minimized"

# Layouts
"SUPER+t" = "setlayout,tile"
# "SUPER+v" = "setlayout,vertical_grid"
# "SUPER+c" = "setlayout,spiral"
# "SUPER+x" = "setlayout,scroller"
"SUPER+n" = "switch_layout"
"SUPER+a" = "togglegaps"

# Bind Alt+Shift_L to cycle keyboard layout
# "ALT+l" = "switch_keyboard_layout"
"ALT+l" = "spawn,set-language"

"ALT+f" = "togglefullscreen"
"ALT+space" = "togglefloating"

# switch window focus
"SUPER+j" = "focusstack,next"
"SUPER+k" = "focusstack,prev"
"SUPER+h" = "focusdir,left"
"SUPER+l" = "focusdir,right"

# swap window
"SUPER+SHIFT+k" = "exchange_client,up"
"SUPER+SHIFT+j" = "exchange_client,down"
"SUPER+SHIFT+h" = "exchange_client,left"
"SUPER+SHIFT+l" = "exchange_client,right"

# audio and brightness settings
"XF86AudioRaiseVolume" = "spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+"
"XF86AudioLowerVolume" = "spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-"
"XF86AudioMute" = "spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
"XF86MonBrightnessUp" = "spawn,brightnessctl s 2%+"
"XF86MonBrightnessDown" = "spawn,brightnessctl s 2%-"
"Print" = "spawn,screenshot"

"SUPER+0" = "toggleoverview"

# User commands
"SUPER+w" = "spawn,profile-selector"
"SUPER+BackSpace" = "spawn,system-actions"
"SUPER+SHIFT+a" = "spawn,ghostty -e term-wrapper pulsemixer"
"SUPER+SHIFT+d" = "spawn,dolphin"
"SUPER+SHIFT+e" = "spawn,chrwp"
"SUPER+s" = "spawn,ghostty -e term-wrapper btop"
"ALT+Tab" = "focuslast"

"SUPER+SHIFT+1" = "tagsilent,1,0"
"SUPER+SHIFT+2" = "tagsilent,2,0"
"SUPER+SHIFT+3" = "tagsilent,3,0"
"SUPER+SHIFT+4" = "tagsilent,4,0"
"SUPER+SHIFT+5" = "tagsilent,5,0"
"SUPER+SHIFT+6" = "tagsilent,6,0"
"SUPER+SHIFT+7" = "tagsilent,7,0"
"SUPER+SHIFT+8" = "tagsilent,8,0"
"SUPER+SHIFT+9" = "tagsilent,9,0"

# Set different keymodes
"SUPER+SHIFT+m" = "setkeymode,movemon"
"ALT+r" = "setkeymode,resizemod"

# ---------------------------------------------------------------------------
# Move monitor mode
# ---------------------------------------------------------------------------
[bind.movemon]
"j" = "focusmon,down"
"k" = "focusmon,up"
"h" = "focusmon,left"
"l" = "focusmon,right"

"SUPER+j" = "focusstack,next"
"SUPER+k" = "focusstack,prev"
"SUPER+h" = "focusdir,left"
"SUPER+l" = "focusdir,right"

"SUPER+SHIFT+j" = "tagmon,down"
"SUPER+SHIFT+k" = "tagmon,up"
"SUPER+SHIFT+h" = "tagmon,left"
"SUPER+SHIFT+l" = "tagmon,right"
"Escape" = "setkeymode,default"

# ---------------------------------------------------------------------------
# Window resizing/moving mode
# ---------------------------------------------------------------------------
[bind.resizemod]
"k" = "movewin,+0,-50"
"j" = "movewin,+0,+50"
"h" = "movewin,-50,+0"
"l" = "movewin,+50,+0"

"CTRL+k" = "resizewin,+0,-50"
"CTRL+j" = "resizewin,+0,+50"
"CTRL+h" = "resizewin,-50,+0"
"CTRL+l" = "resizewin,+50,+0"

"SHIFT+k" = "smartmovewin,up"
"SHIFT+j" = "smartmovewin,down"
"SHIFT+h" = "smartmovewin,left"
"SHIFT+l" = "smartmovewin,right"

"CTRL+SHIFT+k" = "smartresizewin,up"
"CTRL+SHIFT+j" = "smartresizewin,down"
"CTRL+SHIFT+h" = "smartresizewin,left"
"CTRL+SHIFT+l" = "smartresizewin,right"

"Escape" = "setkeymode,default"

# ---------------------------------------------------------------------------
# Mouse / gestures
# ---------------------------------------------------------------------------
[mousebind.default]
"SUPER+btn_left" = "moveresize,curmove"
"SUPER+btn_right" = "moveresize,curresize"

[gesturebind.default]
"none+left+3" = "focusdir,left"
"none+right+3" = "focusdir,right"
"none+up+3" = "focusdir,up"
"none+down+3" = "focusdir,down"
"none+left+4" = "viewtoleft_have_client"
"none+right+4" = "viewtoright_have_client"
"none+up+4" = "toggleoverview"
"none+down+4" = "toggleoverview"

# ---------------------------------------------------------------------------
# Tag rules
# Layouts in mango are per tag. So we'll set all tags to tile by default.
# ---------------------------------------------------------------------------
[[rule.tag_rule]]
id = 1
layout_name = "tile"
[[rule.tag_rule]]
id = 2
layout_name = "tile"
[[rule.tag_rule]]
id = 3
layout_name = "tile"
[[rule.tag_rule]]
id = 4
layout_name = "tile"
[[rule.tag_rule]]
id = 5
layout_name = "tile"
[[rule.tag_rule]]
id = 6
layout_name = "tile"
[[rule.tag_rule]]
id = 7
layout_name = "tile"
[[rule.tag_rule]]
id = 8
layout_name = "tile"
[[rule.tag_rule]]
id = 9
layout_name = "tile"

# Vertical tile for the vertical monitor
[[rule.tag_rule]]
id = 1
monitor_name = "DP-1"
layout_name = "vertical_tile"
[[rule.tag_rule]]
id = 2
monitor_name = "DP-1"
layout_name = "vertical_tile"
[[rule.tag_rule]]
id = 3
monitor_name = "DP-1"
layout_name = "vertical_tile"
[[rule.tag_rule]]
id = 4
monitor_name = "DP-1"
layout_name = "vertical_tile"
[[rule.tag_rule]]
id = 5
monitor_name = "DP-1"
layout_name = "vertical_tile"
[[rule.tag_rule]]
id = 6
monitor_name = "DP-1"
layout_name = "vertical_tile"
[[rule.tag_rule]]
id = 7
monitor_name = "DP-1"
layout_name = "vertical_tile"
[[rule.tag_rule]]
id = 8
monitor_name = "DP-1"
layout_name = "vertical_tile"
[[rule.tag_rule]]
id = 9
monitor_name = "DP-1"
layout_name = "vertical_tile"

# ---------------------------------------------------------------------------
# Monitor rules
#     		    |  DP-3  |
# | DP-1 |     	|  DP-2  |   | HDMI |
# ---------------------------------------------------------------------------
[[rule.monitor_rule]]
name = "^DP-1"
width = 1920
height = 1080
refresh = 60
rr = 1
x = -1080
y = -550

[[rule.monitor_rule]]
name = "^HDMI-A-1"
width = 1920
height = 1080
refresh = 60
x = 3440
y = -360

[[rule.monitor_rule]]
name = "^DP-3"
width = 1920
height = 1080
refresh = 60
x = 760
y = -1080

[[rule.monitor_rule]]
name = "^DP-2"
width = 3440
height = 1440
refresh = 160
x = 0
y = 0

# ---------------------------------------------------------------------------
# Window rules
# ---------------------------------------------------------------------------
[[rule.window_rule]]
focused_opacity = 0.90
unfocused_opacity = 0.8
app_id = "com.ghostty.neto"

[[rule.window_rule]]
is_floating = 1
is_overlay = 0
width = 600
height = 800
app_id = "clipse-gui"
title = "Clipse GUI"
